<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODID // KANBAN TERMINAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050811;
            --bg-surface: #0a0f1d;
            --bg-card: rgba(14, 22, 41, 0.75);
            --bg-card-hover: rgba(20, 32, 60, 0.9);
            --border-color: rgba(0, 240, 255, 0.15);
            --border-glow: rgba(0, 240, 255, 0.4);
            
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --purple: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.35);
            --green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --amber: #ffaa00;
            --amber-glow: rgba(255, 170, 0, 0.35);
            --red: #ff3366;
            --red-glow: rgba(255, 51, 102, 0.35);

            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            
            --font-display: 'Orbitron', sans-serif;
            --font-tech: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-tech);
            font-size: 16px;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.04) 0%, transparent 40%),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
        }

        /* Top Scanline overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            opacity: 0.3;
        }

        /* Main Container */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 28px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 120px;
            height: 2px;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border: 1px solid var(--cyan);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 15px var(--cyan-glow);
            color: var(--cyan);
        }

        .brand-icon svg {
            width: 24px;
            height: 24px;
        }

        .brand-text h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .brand-text p {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--cyan);
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .dev-ui-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 6px;
            color: #d8b4fe;
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .dev-ui-link:hover {
            background: var(--purple);
            color: #ffffff;
            border-color: var(--purple);
            box-shadow: 0 0 16px var(--purple-glow);
            transform: translateY(-1px);
        }

        /* Control Center / Forms */
        .control-panel {
            margin-bottom: 32px;
        }

        .panel-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .panel-box::before {
            content: '';
            position: absolute;
            top: -1px;
            right: 20px;
            width: 30px;
            height: 2px;
            background: var(--cyan);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.95rem;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .panel-title .badge {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            padding: 2px 6px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .tech-input {
            flex: 1;
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 12px 16px;
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .tech-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 12px var(--cyan-glow);
            background: rgba(10, 15, 29, 0.95);
        }

        .tech-input::placeholder {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .tech-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 240, 255, 0.05) 100%);
            border: 1px solid var(--cyan);
            border-radius: 6px;
            color: var(--cyan);
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 0 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .tech-btn:hover {
            background: var(--cyan);
            color: var(--bg-base);
            box-shadow: 0 0 20px var(--cyan-glow);
            transform: translateY(-1px);
        }

        .tech-btn:active {
            transform: translateY(1px);
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .stats-summary {
            display: flex;
            gap: 20px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .stat-item span {
            color: var(--cyan);
            font-weight: 700;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            background: rgba(14, 22, 41, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-dim);
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sm:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(0, 240, 255, 0.05);
        }

        /* Kanban Board */
        .kanban-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            align-items: flex-start;
        }

        @media (max-width: 1024px) {
            .kanban-grid {
                grid-template-columns: 1fr;
            }
        }

        .kanban-column {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .kanban-column.col-todo {
            border-top: 3px solid var(--cyan);
        }

        .kanban-column.col-inprogress {
            border-top: 3px solid var(--amber);
        }

        .kanban-column.col-done {
            border-top: 3px solid var(--green);
        }

        /* Drag over highlight */
        .kanban-column.drag-over {
            background: rgba(14, 22, 41, 0.95);
            border-color: var(--cyan);
            box-shadow: 0 0 25px var(--cyan-glow);
            transform: scale(1.01);
        }

        .col-inprogress.drag-over {
            border-color: var(--amber);
            box-shadow: 0 0 25px var(--amber-glow);
        }

        .col-done.drag-over {
            border-color: var(--green);
            box-shadow: 0 0 25px var(--green-glow);
        }

        .col-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 18px;
        }

        .col-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 1.05rem;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .col-todo .col-title svg { color: var(--cyan); }
        .col-inprogress .col-title svg { color: var(--amber); }
        .col-done .col-title svg { color: var(--green); }

        .col-counter {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            font-weight: 600;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            min-height: 200px;
        }

        /* Task Card */
        .task-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 16px;
            position: relative;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-card.is-dragging {
            opacity: 0.4;
            transform: scale(0.96);
            border: 1px dashed var(--cyan);
        }

        .task-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 3px; height: 100%;
            background: var(--text-muted);
            transition: all 0.2s ease;
        }

        .col-todo .task-card::before { background: var(--cyan); }
        .col-inprogress .task-card::before { background: var(--amber); }
        .col-done .task-card::before { background: var(--green); }

        .task-card:hover {
            transform: translateY(-3px);
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .col-todo .task-card:hover { box-shadow: 0 8px 25px rgba(0, 240, 255, 0.15); border-color: rgba(0, 240, 255, 0.3); }
        .col-inprogress .task-card:hover { box-shadow: 0 8px 25px rgba(255, 170, 0, 0.15); border-color: rgba(255, 170, 0, 0.3); }
        .col-done .task-card:hover { box-shadow: 0 8px 25px rgba(0, 255, 136, 0.15); border-color: rgba(0, 255, 136, 0.3); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drag-indicator {
            color: var(--text-muted);
            opacity: 0.5;
            display: flex;
            align-items: center;
        }

        .task-card:hover .drag-indicator {
            opacity: 1;
            color: var(--cyan);
        }

        .card-uuid {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--cyan);
            background: rgba(0, 240, 255, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .card-uuid:hover {
            background: rgba(0, 240, 255, 0.2);
            color: #ffffff;
        }

        .card-version {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .card-desc {
            font-family: var(--font-tech);
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 14px;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        .status-badge.TODO {
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .status-badge.IN_PROGRESS {
            background: rgba(255, 170, 0, 0.1);
            color: var(--amber);
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .status-badge.DONE {
            background: rgba(0, 255, 136, 0.1);
            color: var(--green);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--text-muted);
            padding: 4px 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            gap: 4px;
        }

        .card-btn:hover {
            color: var(--cyan);
            border-color: var(--cyan);
            background: rgba(0, 240, 255, 0.08);
        }

        .card-btn.move-btn:hover {
            color: var(--amber);
            border-color: var(--amber);
            background: rgba(255, 170, 0, 0.08);
        }

        /* Empty State */
        .empty-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            gap: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-top: 10px;
            pointer-events: none;
        }

        .empty-column svg {
            width: 32px;
            height: 32px;
            opacity: 0.3;
        }

        /* Toast notification */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: rgba(10, 15, 29, 0.95);
            border: 1px solid var(--cyan);
            border-left: 4px solid var(--cyan);
            padding: 12px 18px;
            border-radius: 6px;
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--cyan-glow);
            animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            backdrop-filter: blur(10px);
        }

        .toast.error {
            border-color: var(--red);
            border-left-color: var(--red);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--red-glow);
        }

        .toast.success {
            border-color: var(--green);
            border-left-color: var(--green);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--green-glow);
        }

        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="container">
        <!-- Top Header -->
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M9 3v18"/>
                        <path d="M15 3v18"/>
                        <path d="M3 9h18"/>
                        <path d="M3 15h18"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>TODID // KANBAN</h1>
                    <p>QUANTUM DIRECTIVE MATRIX</p>
                </div>
            </div>

            <div class="header-actions">
                <a href="/q/dev-ui" target="_blank" rel="noopener noreferrer" class="dev-ui-link" title="Open Quarkus Dev UI">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    QUARKUS DEV UI
                </a>
            </div>
        </header>

        <!-- Command Deck (Create Directive) -->
        <div class="control-panel">
            <div class="panel-box">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        INITIALIZE DIRECTIVE
                        <span class="badge">POST</span>
                    </div>
                </div>
                <form id="create-form" class="input-group" onsubmit="handleCreateTask(event)">
                    <input 
                        type="text" 
                        id="task-description-input" 
                        class="tech-input" 
                        placeholder="Enter directive description..." 
                        autocomplete="off"
                        required
                    />
                    <button type="submit" class="tech-btn" id="btn-create">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        CREATE
                    </button>
                </form>
            </div>
        </div>

        <!-- Action Bar & Stats -->
        <div class="action-bar">
            <div class="stats-summary">
                <div class="stat-item">TOTAL ACTIVE: <span id="stat-total">0</span></div>
                <div class="stat-item">TODO: <span id="stat-todo" style="color: var(--cyan);">0</span></div>
                <div class="stat-item">IN PROGRESS: <span id="stat-inprogress" style="color: var(--amber);">0</span></div>
                <div class="stat-item">DONE: <span id="stat-done" style="color: var(--green);">0</span></div>
            </div>

            <div class="quick-actions">
                <button class="btn-sm" onclick="syncAllTasks()" title="Synchronize all cards with API">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    SYNC BOARD
                </button>
                <button class="btn-sm" onclick="clearTrackedTasks()" title="Clear local cards from view">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    CLEAR VIEW
                </button>
            </div>
        </div>

        <!-- Kanban Board -->
        <div class="kanban-grid">
            <!-- Column: TODO -->
            <div 
                class="kanban-column col-todo" 
                data-status="TODO"
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event, 'TODO')"
            >
                <div class="col-header">
                    <div class="col-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 14 14"/>
                        </svg>
                        TODO
                    </div>
                    <div class="col-counter" id="count-todo">0</div>
                </div>
                <div class="cards-container" id="column-TODO">
                    <!-- Cards will be rendered here -->
                </div>
            </div>

            <!-- Column: IN_PROGRESS -->
            <div 
                class="kanban-column col-inprogress" 
                data-status="IN_PROGRESS"
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event, 'IN_PROGRESS')"
            >
                <div class="col-header">
                    <div class="col-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polygon points="10 8 16 12 10 16 10 8"/>
                        </svg>
                        IN PROGRESS
                    </div>
                    <div class="col-counter" id="count-inprogress">0</div>
                </div>
                <div class="cards-container" id="column-IN_PROGRESS">
                    <!-- Cards will be rendered here -->
                </div>
            </div>

            <!-- Column: DONE -->
            <div 
                class="kanban-column col-done" 
                data-status="DONE"
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event, 'DONE')"
            >
                <div class="col-header">
                    <div class="col-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        DONE
                    </div>
                    <div class="col-counter" id="count-done">0</div>
                </div>
                <div class="cards-container" id="column-DONE">
                    <!-- Cards will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        const API_BASE = '/api/v1/tasks';
        const STORAGE_KEY = 'todid_tracked_task_ids';

        // Local state
        let trackedIds = new Set();
        let tasksMap = new Map();
        let draggedTaskId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTrackedIdsFromStorage();
            if (trackedIds.size > 0) {
                syncAllTasks();
            } else {
                renderBoard();
            }
        });

        // Storage helpers
        function loadTrackedIdsFromStorage() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) {
                        trackedIds = new Set(parsed);
                    }
                }
            } catch (e) {
                console.error('Error reading from localStorage', e);
            }
        }

        function saveTrackedIdsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(trackedIds)));
            } catch (e) {
                console.error('Error saving to localStorage', e);
            }
        }

        // Telemetry logger
        function logTelemetry(message, type = 'info') {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
            console.log(`[${timeStr}] [${type.toUpperCase()}] ${message}`);
        }

        // Toast notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Create Task
        async function handleCreateTask(event) {
            event.preventDefault();
            const input = document.getElementById('task-description-input');
            const description = input.value.trim();
            if (!description) return;

            const btn = document.getElementById('btn-create');
            btn.disabled = true;

            try {
                logTelemetry(`Starting POST /api/v1/tasks with payload: "${description}"`, 'info');

                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description })
                });

                if (response.status === 201) {
                    const location = response.headers.get('Location');
                    let newId = null;

                    if (location) {
                        const parts = location.split('/');
                        newId = parts[parts.length - 1];
                    }

                    showToast('Directive initialized successfully!', 'success');
                    logTelemetry(`HTTP 201 CREATED. Location: ${location || 'N/A'}`, 'success');

                    input.value = '';

                    if (newId) {
                        trackedIds.add(newId);
                        saveTrackedIdsToStorage();
                        await fetchTaskById(newId);
                    } else {
                        logTelemetry('Notice: Location header not directly accessible.', 'warn');
                    }
                } else {
                    const errorText = await response.text();
                    showToast(`Failed to create directive: ${response.status}`, 'error');
                    logTelemetry(`HTTP ${response.status} ERROR: ${errorText}`, 'error');
                }
            } catch (err) {
                showToast(`Network error: ${err.message}`, 'error');
                logTelemetry(`Network error creating directive: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // Fetch task by ID
        async function fetchTaskById(id, isExplicitSearch = false) {
            try {
                logTelemetry(`GET ${API_BASE}/${id}`, 'info');

                const response = await fetch(`${API_BASE}/${id}`);

                if (response.status === 200) {
                    const task = await response.json();

                    // Ignore DELETED status as per requirement
                    if (task.status === 'DELETED') {
                        logTelemetry(`Directive ${id} has status DELETED. Removing from view.`, 'warn');
                        if (isExplicitSearch) {
                            showToast(`Directive ${id} is DELETED and cannot be displayed.`, 'error');
                        }
                        tasksMap.delete(id);
                        trackedIds.delete(id);
                        saveTrackedIdsToStorage();
                        renderBoard();
                        return false;
                    }

                    tasksMap.set(task.id, task);
                    trackedIds.add(task.id);
                    saveTrackedIdsToStorage();

                    logTelemetry(`Directive loaded: [${task.status}] ${task.description} (v${task.version})`, 'success');
                    if (isExplicitSearch) {
                        showToast(`Directive loaded: ${task.description.substring(0, 20)}...`, 'success');
                    }

                    renderBoard();
                    return true;
                } else if (response.status === 404) {
                    logTelemetry(`Directive ${id} not found (HTTP 404)`, 'error');
                    if (isExplicitSearch) {
                        showToast(`Directive not found for specified UUID`, 'error');
                    }
                    trackedIds.delete(id);
                    tasksMap.delete(id);
                    saveTrackedIdsToStorage();
                    renderBoard();
                    return false;
                } else {
                    logTelemetry(`Error fetching directive ${id}: HTTP ${response.status}`, 'error');
                    if (isExplicitSearch) {
                        showToast(`Search error: HTTP ${response.status}`, 'error');
                    }
                    return false;
                }
            } catch (err) {
                logTelemetry(`Network error fetching directive ${id}: ${err.message}`, 'error');
                if (isExplicitSearch) {
                    showToast(`Connection error while fetching directive`, 'error');
                }
                return false;
            }
        }

        // Change Task Status (PATCH /api/v1/tasks/{id})
        async function updateTaskStatus(taskId, newStatus) {
            const task = tasksMap.get(taskId);
            if (!task) return;

            if (task.status === newStatus) return;

            logTelemetry(`Starting PATCH ${API_BASE}/${taskId} for status: ${newStatus}`, 'info');

            try {
                const response = await fetch(`${API_BASE}/${taskId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    logTelemetry(`HTTP ${response.status} OK: Directive ${taskId} transitioned to ${newStatus}`, 'success');

                    if (newStatus === 'DELETED') {
                        tasksMap.delete(taskId);
                        trackedIds.delete(taskId);
                        saveTrackedIdsToStorage();
                        renderBoard();
                    } else {
                        // Reload task to get updated version
                        await fetchTaskById(taskId);
                    }
                } else {
                    const errText = await response.text();
                    logTelemetry(`Error moving directive ${taskId}: HTTP ${response.status} ${errText}`, 'error');
                    showToast(`Failed to update status: HTTP ${response.status}`, 'error');
                }
            } catch (err) {
                logTelemetry(`Network error updating directive status: ${err.message}`, 'error');
                showToast(`Connection error while moving card`, 'error');
            }
        }

        // Drag and Drop Handlers
        function handleDragStart(event, taskId) {
            draggedTaskId = taskId;
            event.dataTransfer.setData('text/plain', taskId);
            event.dataTransfer.effectAllowed = 'move';

            setTimeout(() => {
                const cardEl = document.getElementById(`card-${taskId}`);
                if (cardEl) cardEl.classList.add('is-dragging');
            }, 0);
        }

        function handleDragEnd(event, taskId) {
            draggedTaskId = null;
            const cardEl = document.getElementById(`card-${taskId}`);
            if (cardEl) cardEl.classList.remove('is-dragging');

            document.querySelectorAll('.kanban-column').forEach(col => {
                col.classList.remove('drag-over');
            });
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const col = event.currentTarget;
            col.classList.add('drag-over');
        }

        function handleDragLeave(event) {
            const col = event.currentTarget;
            col.classList.remove('drag-over');
        }

        async function handleDrop(event, targetStatus) {
            event.preventDefault();
            const col = event.currentTarget;
            col.classList.remove('drag-over');

            const taskId = event.dataTransfer.getData('text/plain') || draggedTaskId;
            if (!taskId) return;

            await updateTaskStatus(taskId, targetStatus);
        }

        // Sync all tracked tasks
        async function syncAllTasks() {
            if (trackedIds.size === 0) {
                showToast('No tracked directives to synchronize.', 'info');
                return;
            }

            logTelemetry(`Synchronizing ${trackedIds.size} tracked directives...`, 'info');
            const promises = Array.from(trackedIds).map(id => fetchTaskById(id));
            await Promise.all(promises);
            showToast('Board synchronized!', 'success');
        }

        // Clear local tracking
        function clearTrackedTasks() {
            tasksMap.clear();
            trackedIds.clear();
            saveTrackedIdsToStorage();
            renderBoard();
            logTelemetry('Local view cleared.', 'warn');
            showToast('Local directives removed from view.', 'info');
        }

        // Render Kanban Board
        function renderBoard() {
            const columns = {
                'TODO': document.getElementById('column-TODO'),
                'IN_PROGRESS': document.getElementById('column-IN_PROGRESS'),
                'DONE': document.getElementById('column-DONE')
            };

            const counts = {
                'TODO': 0,
                'IN_PROGRESS': 0,
                'DONE': 0
            };

            // Clear columns
            Object.values(columns).forEach(col => col.innerHTML = '');

            // Populate cards
            tasksMap.forEach((task) => {
                if (task.status === 'DELETED') return;

                const columnEl = columns[task.status];
                if (columnEl) {
                    counts[task.status]++;
                    columnEl.appendChild(createCardElement(task));
                }
            });

            // Update counters
            document.getElementById('count-todo').textContent = counts['TODO'];
            document.getElementById('count-inprogress').textContent = counts['IN_PROGRESS'];
            document.getElementById('count-done').textContent = counts['DONE'];

            document.getElementById('stat-todo').textContent = counts['TODO'];
            document.getElementById('stat-inprogress').textContent = counts['IN_PROGRESS'];
            document.getElementById('stat-done').textContent = counts['DONE'];
            document.getElementById('stat-total').textContent = counts['TODO'] + counts['IN_PROGRESS'] + counts['DONE'];

            // Empty state check
            Object.entries(columns).forEach(([status, colEl]) => {
                if (colEl.children.length === 0) {
                    colEl.innerHTML = `
                        <div class="empty-column">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            <span>NO DIRECTIVES IN THIS NODE<br><small style="opacity: 0.6;">(Drag a card here)</small></span>
                        </div>
                    `;
                }
            });
        }

        // Create card element
        function createCardElement(task) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.id = `card-${task.id}`;
            card.draggable = true;

            card.ondragstart = (e) => handleDragStart(e, task.id);
            card.ondragend = (e) => handleDragEnd(e, task.id);

            const displayStatus = task.status ? task.status.replace('_', ' ') : 'UNKNOWN';

            // Action buttons to move
            let moveButtons = '';
            if (task.status === 'TODO') {
                moveButtons = `
                    <button class="card-btn move-btn" title="Move to IN PROGRESS" onclick="updateTaskStatus('${task.id}', 'IN_PROGRESS')">
                        IN PROGRESS →
                    </button>
                `;
            } else if (task.status === 'IN_PROGRESS') {
                moveButtons = `
                    <button class="card-btn move-btn" title="Move back to TODO" onclick="updateTaskStatus('${task.id}', 'TODO')">
                        ← TODO
                    </button>
                    <button class="card-btn move-btn" title="Advance to DONE" onclick="updateTaskStatus('${task.id}', 'DONE')">
                        DONE →
                    </button>
                `;
            } else if (task.status === 'DONE') {
                moveButtons = `
                    <button class="card-btn move-btn" title="Return to IN PROGRESS" onclick="updateTaskStatus('${task.id}', 'IN_PROGRESS')">
                        ← IN PROGRESS
                    </button>
                `;
            }

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="drag-indicator" title="Drag to move">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="5" r="1"/>
                                <circle cx="9" cy="12" r="1"/>
                                <circle cx="9" cy="19" r="1"/>
                                <circle cx="15" cy="5" r="1"/>
                                <circle cx="15" cy="12" r="1"/>
                                <circle cx="15" cy="19" r="1"/>
                            </svg>
                        </span>
                        <div class="card-uuid" title="Click to copy UUID" onclick="copyToClipboard('${task.id}')">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            ${task.id.substring(0, 8)}...
                        </div>
                    </div>
                    <div class="card-version" title="Event Store Version">
                        v${task.version}
                    </div>
                </div>
                <div class="card-desc">
                    ${escapeHtml(task.description)}
                </div>
                <div class="card-footer">
                    <span class="status-badge ${task.status}">
                        ● ${displayStatus}
                    </span>
                    <div class="card-actions">
                        ${moveButtons}
                        <button class="card-btn" title="Refresh card data" onclick="fetchTaskById('${task.id}', true)">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `;

            return card;
        }

        // Copy UUID to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`UUID copied to clipboard!`, 'success');
                logTelemetry(`UUID copied: ${text}`, 'info');
            }).catch(() => {
                showToast(`Failed to copy UUID`, 'error');
            });
        }

        // Escape HTML for XSS safety
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
